[package]
name = "autoclicker"
version = "1.0.0"
edition = "2021"
description = "Minimal Windows autoclicker: hold a button to auto-click LMB. egui GUI + system tray."
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
env_logger = "0.11"
# glow-рендерер вместо wgpu: меньше зависимостей, меньше exe, работает на старых GPU/VM.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
] }
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
